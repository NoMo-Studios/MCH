<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCH</title>
<meta name="description" content="Tu libreta de entreno: rutina, pesos y progreso.">
<meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="mch-display-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="mch-display-700.woff" as="font" type="font/woff" crossorigin>
<style>
/*
VOICE: callado y preciso, como una libreta de entreno; se lee de un vistazo entre series.
IDEA: la libreta del que entrena ("60 × 8") y los discos: el círculo es la marca de "hecho".
PICTURE: los números de cada serie, grandes y redondos; en Progreso, la línea que sube.
COLOUR + TYPE: tiza y grafito; el azul del disco de 20 solo significa progreso. MCH Display
  (subconjunto de TeX Gyre Adventor) para números y títulos; la letra del sistema para el texto.
LAYOUT: una columna alineada a la izquierda; las acciones abajo, donde llega el pulgar.
*/
@font-face{font-family:"MCH Display";src:url("mch-display-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"MCH Display";src:url("mch-display-700.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
:root{
  color-scheme:light dark;
  --bg:#FBFBFA;--raised:#FFFFFF;--field:#EFEFEC;--field-2:#E5E5E1;--line:#E2E2DE;
  --ink:#161616;--ink-2:#63635E;--ink-3:#8E8E88;--on-ink:#FBFBFA;
  --blue:#2445D6;--on-blue:#FFFFFF;--red:#C0263F;
  --seg-on:#FFFFFF;--scrim:rgba(22,22,22,.32);--shadow:0 -1px 0 rgba(0,0,0,.04),0 -16px 48px rgba(0,0,0,.14);
  --display:"MCH Display",Futura,"Avenir Next",sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--raised:#151515;--field:#1B1B1B;--field-2:#262626;--line:#282828;
  --ink:#F2F2EE;--ink-2:#9C9C97;--ink-3:#5E5E5A;--on-ink:#000000;
  --blue:#7189FF;--on-blue:#000000;--red:#FF6B81;
  --seg-on:#3A3A3A;--scrim:rgba(0,0,0,.62);--shadow:0 -1px 0 rgba(255,255,255,.07);
}}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
label{touch-action:manipulation}
p{margin:0}
[hidden]{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 6px) 20px calc(108px + var(--sb))}
#app.full{padding-bottom:calc(40px + var(--sb))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin:0 -10px}
.top .sp{flex:1}
.top .link{padding:0 10px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink);flex:none;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.ibtn:active{transform:scale(.94);background:var(--field)}
.ibtn:disabled{opacity:.25;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 4px;font-weight:600;color:var(--ink);border-radius:22px;transition:transform 160ms var(--ease-out),opacity 160ms ease}
.back:active{transform:scale(.97);opacity:.6}
.back svg{width:24px;height:24px}

.title{font:700 34px/1.06 var(--display);letter-spacing:-.01em;margin:6px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--ink-2);font-size:15px}
.h{font:700 22px/1.15 var(--display);margin:0}
.sec{margin-top:40px}
.sec.first{margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-head .aux{font-size:15px;color:var(--ink-2);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.gap{margin-top:12px}
.lead{margin-top:16px;color:var(--ink-2);max-width:32em}
.foot{margin-top:44px;color:var(--ink-2)}
.opt{color:var(--ink-2);font-weight:400}

.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--ink);transition:opacity 160ms ease}
.link:active{opacity:.5}
.link svg{width:20px;height:20px}
.link.quiet{color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border-radius:16px;font:600 17px/1.1 var(--text);color:var(--ink);text-align:center;transition:transform 160ms var(--ease-out),opacity 160ms ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--field)}
.btn.text{min-height:48px}
.btn.danger{color:var(--red)}
.btn svg{width:20px;height:20px}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px}
.w-end,.form-acts{display:grid;gap:10px;margin-top:32px}

/* Hoy */
.hero{margin-top:30px}
.hero .muted{font-size:15px}
.hero-day{font:400 64px/1 var(--display);letter-spacing:-.025em;margin-top:8px;font-variant-numeric:proportional-nums;overflow-wrap:anywhere}
.hero-label{font:700 22px/1.2 var(--display);margin:8px 0 6px}
.hero-acts{display:grid;gap:4px;margin-top:22px}
.hero.empty .hero-label{font-size:28px;margin-top:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:12px}
.wd{display:grid;justify-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.wd i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:block}
.wd.on i{background:var(--ink);box-shadow:none}
.wd.today span{color:var(--ink);font-weight:700}
.wd.today:not(.on) i{box-shadow:inset 0 0 0 1.5px var(--ink)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--field);font-size:15px}
.banner .link{flex:none;padding:0 8px}
.nudge p{font-size:15px;color:var(--ink-2);max-width:32em}

/* Listas */
.list{list-style:none;margin:0;padding:0}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 0;text-align:left;color:var(--ink);transition:opacity 160ms ease}
button.row:active{opacity:.5}
.row .main{flex:1;display:grid;gap:2px}
.row .t{font-weight:600}
.row .s{font-size:15px;color:var(--ink-2)}
.row .num{font:400 17px var(--display);white-space:nowrap}
.chev{color:var(--ink-3);width:20px!important;height:20px!important}
.toks{display:flex;flex-wrap:wrap;gap:2px 14px}
.tk{font:400 16px/1.5 var(--display);color:var(--ink);white-space:nowrap}

/* Entreno */
.ex{padding:30px 0 10px}
.ex+.ex{border-top:1px solid var(--line)}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-name{font:700 21px/1.22 var(--display);margin:0;padding-top:8px;overflow-wrap:anywhere}
.ex-top .ibtn{margin:-2px -10px 0 0;color:var(--ink-2)}
.ex-meta{font-size:15px;color:var(--ink-2);margin-top:2px}
.last{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 14px;margin-top:12px;font-size:15px;color:var(--ink-2)}
.hint{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:15px;max-width:32em}
.plate{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:-1px}
.plate svg{width:14px;height:14px;stroke-width:2.4}
.hint.up .plate{background:var(--blue);color:var(--on-blue)}
.hint.flat{color:var(--ink-2)}
.hint.flat .plate{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.ex-note{margin-top:10px;font-size:15px;color:var(--ink-2);max-width:32em}
.ex-note b{color:var(--ink);font-weight:600;margin-right:4px}
.sets{margin-top:16px}
.set-h,.set{display:grid;grid-template-columns:22px minmax(0,1.2fr) 16px minmax(0,1fr) 48px;column-gap:8px;align-items:center}
.set-h{font-size:13px;color:var(--ink-2);text-align:center}
.set{margin-top:8px}
.set .n{font:400 15px var(--display);color:var(--ink-2);text-align:center}
.set input{width:100%;height:54px;border:0;border-radius:14px;background:var(--field);color:var(--ink);text-align:center;font:400 24px/1 var(--display);padding:0 6px;-webkit-appearance:none;appearance:none;transition:background-color 160ms ease,box-shadow 160ms ease}
.set input::placeholder{color:var(--ink-2);opacity:1}
.set input:focus{outline:none;background:var(--field-2);box-shadow:inset 0 0 0 2px var(--ink)}
.set .x{text-align:center;font:400 20px var(--display);color:var(--ink-3)}
.chk{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.chk>span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.75px var(--ink-3);transition:background-color 140ms ease,box-shadow 140ms ease,transform 160ms var(--ease-out)}
.chk svg{width:22px;height:22px;stroke-width:2.25;color:var(--ink-3);transition:color 140ms ease}
.chk:active>span{transform:scale(.9)}
.chk:focus-visible{outline-offset:0;border-radius:50%}
.set.done input{background:transparent;font-weight:700}
.set.done .chk>span{background:var(--ink);box-shadow:none}
.set.done .chk svg{color:var(--on-ink)}
.set.rec .chk>span{background:var(--blue)}
.set.rec .chk svg{color:var(--on-blue)}
.set.pop .chk>span{animation:pop 320ms var(--ease-out)}
@keyframes pop{from{transform:scale(.86)}}
.rec-line{grid-column:2/-1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:4px 0 2px}
.rec-line i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.rec-line.new{animation:rec-in 260ms var(--ease-out) both}
@keyframes rec-in{from{opacity:0;transform:translateY(-4px)}}
.ex-acts{display:flex;gap:22px;margin-top:8px}

/* Historial */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.cal-nav{display:flex;margin-right:-10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;margin-top:6px;text-align:center}
.ch{font-size:13px;color:var(--ink-2);padding:4px 0 6px}
.cd{display:grid;place-items:center;height:44px;color:var(--ink)}
.cd>span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 16px var(--display);transition:transform 160ms var(--ease-out)}
.cd.on>span{background:var(--ink);color:var(--on-ink)}
.cd.today>span{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd.today.on>span{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cd.future{color:var(--ink-3)}
.cd.skip>span,.lg.skip{box-shadow:none;border:1.5px dashed var(--ink-2)}
.cd.skip.today>span{border-color:var(--ink)}
.year{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px;margin-top:10px}
@media(min-width:520px){.year{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sil{position:relative;aspect-ratio:400/360;margin-top:8px}
.sil svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sil .fg{fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sil .ld{fill:none;stroke:var(--line);stroke-width:1.2}
.sil .hs{fill:var(--bg);stroke:var(--ink-2);stroke-width:1.5}
.sil .hs.on{fill:var(--ink);stroke:var(--ink)}
.sl{position:absolute;transform:translateY(-50%);display:grid;gap:0;min-height:44px;align-content:center;width:24%;text-align:left;font-size:13px;color:var(--ink-2);transition:opacity 160ms ease}
.sl.r{left:76%}.sl.l{right:76%;text-align:right}
.sl b{font:400 16px var(--display);color:var(--ink);white-space:nowrap}
.sl:active{opacity:.5}
.vscale{margin-top:18px}
.vs-tr{position:relative;height:10px;border-radius:5px;background:var(--field)}
.vs-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.vs-ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--blue);transform:translateX(-1px)}
.vs-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid var(--bg);transform:translate(-50%,-50%)}
.vs-x{position:relative;display:flex;justify-content:space-between;font:400 13px var(--display);color:var(--ink-2);margin-top:8px;height:18px}
.vs-x span:nth-child(2){position:absolute;transform:translateX(-50%);color:var(--blue)}
.ph-grid{align-items:start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ph{display:block;position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--field);transition:transform 160ms var(--ease-out)}
.ph:active{transform:scale(.97)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph.cmp{display:grid;place-items:center;font-weight:600;font-size:15px}
.ph-big{display:block;width:100%;max-height:62dvh;object-fit:contain;border-radius:14px;background:var(--field)}
.cmp{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--field);margin-top:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp-line{position:absolute;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-1px);box-shadow:0 0 4px rgba(0,0,0,.4)}
.cmp-l,.cmp-r{position:absolute;top:10px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px}
.cmp-l{left:10px}.cmp-r{right:10px}
.cmp-range{width:100%;margin-top:14px;accent-color:var(--ink)}
.ph-strip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.ph.sm{flex:none;width:64px}
.ph.sel{outline:2px solid var(--ink);outline-offset:2px}
.ym{display:flex;flex-direction:column;align-self:start;text-align:left;padding:4px 0;border-radius:10px;transition:opacity 160ms ease}
.ym:active{opacity:.55}
.ym-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:6px}
.ym-h b{font:400 14px var(--display);color:var(--ink-2)}
.ym-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ym-g i{aspect-ratio:1;border-radius:50%;background:var(--field);display:block}
.ym-g i.e{background:none}
.ym-g i.on{background:var(--ink)}
.ym-g i.sk{background:none;border:1px dashed var(--ink-2)}
.ym-g i.fu{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.ym-g i.td{outline:1.5px solid var(--ink);outline-offset:1px}
.wd.skip i{box-shadow:none;border:1.5px dashed var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.on{background:var(--ink)}
.pick-day li{padding:0;display:block}
.pick-day .row{min-height:56px}
button.cd:active>span{transform:scale(.92)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:grid;gap:2px;align-content:start}
.stat .v{font:400 28px/1.1 var(--display);font-variant-numeric:proportional-nums;white-space:nowrap}
.stat .l{font-size:13px;color:var(--ink-2)}
.sx{padding:18px 0;border-bottom:1px solid var(--line)}
.sx .ex-name{padding-top:0;font-size:19px}
.sx .toks{margin-top:4px}
.eset{display:grid;grid-template-columns:22px minmax(0,1.2fr) 16px minmax(0,1fr) 44px;column-gap:8px;align-items:center;margin-top:8px}
.eset .n{font:400 15px var(--display);color:var(--ink-2);text-align:center}
.eset .x{text-align:center;font:400 20px var(--display);color:var(--ink-3)}
.eset input{width:100%;height:50px;border:0;border-radius:14px;background:var(--field);text-align:center;font:400 22px var(--display);-webkit-appearance:none;appearance:none}
.eset input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.eset .ibtn{color:var(--ink-2)}

/* Progreso */
.bars{display:grid;gap:12px;margin-top:14px}
.bar{display:grid;grid-template-columns:6.6em minmax(0,1fr);align-items:center;gap:12px}
.bl{font-size:15px}
.bt{display:flex;align-items:center;gap:8px}
.bf{height:10px;border-radius:0 4px 4px 0;background:var(--ink);flex:none;min-width:4px}
.bv{font:400 16px var(--display)}
.spark{width:64px;height:24px;flex:none}
svg.spark path{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
svg.spark circle{fill:var(--blue)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;margin-top:20px;background:var(--field);border-radius:13px}
.seg button{min-height:38px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink-2);transition:background-color 160ms ease,color 160ms ease}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi{margin-top:22px}
.fig{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fig-n{font:400 56px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:proportional-nums}
.fig-u{font:400 22px var(--display);color:var(--ink-2)}
.kpi .muted{margin-top:8px;font-size:15px}
.chart{position:relative;height:210px;margin:18px 0 6px;touch-action:pan-y;-webkit-user-select:none;user-select:none;border-radius:4px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.chart .tick{font:400 13px var(--display);fill:var(--ink-2)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .end,.chart .xd{fill:var(--blue);stroke:var(--bg);stroke-width:2}
.chart .xl{stroke:var(--ink-3);stroke-width:1;shape-rendering:crispEdges}
.chart:focus-visible{outline-offset:6px}
.tip{position:absolute;left:0;top:0;transform:translateX(-50%);pointer-events:none;background:var(--raised);border-radius:12px;padding:7px 11px;box-shadow:0 0 0 1px var(--line),0 6px 20px rgba(0,0,0,.1);display:grid;gap:1px;opacity:0;transition:opacity 120ms ease;white-space:nowrap;font-size:13px;color:var(--ink-2)}
.tip.on{opacity:1}
.tip b{font:400 18px/1.15 var(--display);color:var(--ink)}

/* Progreso */
.hero-prog{margin-top:22px}
.hero-prog .muted{font-size:15px}
.fig-n.big{font-size:72px}

<script>
{
'use strict';
/* ───────── Datos fijos ───────── */
const KEY='mch.v1';
const MUSCLES=['Pecho','Espalda','Hombro','Trapecio','Bíceps','Tríceps','Antebrazo','Cuádriceps','Femoral','Glúteo','Gemelo','Abdomen','Cuello','Otro'];
const CATALOG=[
 ['Press banca','Pecho'],['Press inclinado con barra','Pecho'],['Press inclinado con mancuernas','Pecho'],['Press con mancuernas','Pecho'],['Aperturas con mancuernas','Pecho'],['Cruce de poleas','Pecho'],['Contractora','Pecho'],
 ['Dominadas','Espalda'],['Jalón al pecho','Espalda'],['Remo con barra','Espalda'],['Remo con mancuerna','Espalda'],['Remo en polea baja','Espalda'],['Remo en máquina','Espalda'],['Peso muerto','Espalda'],['Pullover en polea','Espalda'],
 ['Press militar','Hombro'],['Press de hombro con mancuernas','Hombro'],['Elevaciones laterales','Hombro'],['Pájaros','Hombro'],['Face pull','Hombro'],
 ['Curl con barra','Bíceps'],['Curl con mancuernas','Bíceps'],['Curl martillo','Bíceps'],['Curl en banco Scott','Bíceps'],
 ['Extensión de tríceps en polea','Tríceps'],['Press francés','Tríceps'],['Fondos','Tríceps'],['Patada de tríceps','Tríceps'],
 ['Sentadilla','Cuádriceps'],['Sentadilla búlgara','Cuádriceps'],['Sentadilla hack','Cuádriceps'],['Prensa','Cuádriceps'],['Extensión de cuádriceps','Cuádriceps'],['Zancadas','Cuádriceps'],
 ['Peso muerto rumano','Femoral'],['Curl femoral','Femoral'],
 ['Hip thrust','Glúteo'],['Abductores en máquina','Glúteo'],
 ['Gemelos de pie','Gemelo'],['Gemelos sentado','Gemelo'],
 ['Crunch en polea','Abdomen'],['Elevación de piernas','Abdomen'],['Rueda abdominal','Abdomen'],
 ['Curl de muñeca','Antebrazo']
];
const INCS=[0.5,1,1.25,2,2.5,5];
const TABS=['hoy','historial','progreso','cuerpo'];
const FULL=['workout','day','item','exedit','bodyedit','pick','measure','compare'];
const MEASURES=[['neck','Cuello'],['shoulders','Hombros'],['chest','Pecho'],['arm','Brazo'],['waist','Cintura'],['hip','Cadera'],['thigh','Muslo']];
const MTIPS={neck:'Por debajo de la nuez, con la cinta recta.',shoulders:'Por la parte más ancha de los hombros, con los brazos relajados.',chest:'A la altura de los pezones, después de soltar el aire.',arm:'Brazo flexionado y apretado, por la parte más gruesa del bíceps.',waist:'A la altura del ombligo, en ayunas y sin meter tripa.',hip:'Por la parte más ancha del glúteo.',thigh:'Por la parte más gruesa del muslo, de pie y relajado.'};

/* ───────── Utilidades ───────── */
const app=document.getElementById('app');
const tabsEl=document.getElementById('tabs');
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const toNum=v=>{if(v===''||v==null)return NaN;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:NaN};
const NF=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const NF1=new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
const NFC=new Intl.NumberFormat('es-ES',{notation:'compact',maximumFractionDigits:1});
const kg=n=>NF.format(n);
const r4=n=>Math.round(n*4)/4;
const half=n=>Math.round(n*2)/2;
const e1=(w,r)=>r<=0?0:r===1?w:w*(1+r/30);
const DAY=864e5;
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateNum=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).getTime()};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const F={
  long:new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}),
  short:new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}),
  wd:new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'short'}),
  month:new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}),
  monthOnly:new Intl.DateTimeFormat('es-ES',{month:'long'}),
  time:new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'})
};
const ago=t=>{const d=Math.round((dayStart(Date.now())-dayStart(t))/DAY);return d<=0?'hoy':d===1?'ayer':`hace ${d} días`};
const dur=ms=>{const m=Math.max(1,Math.round(ms/6e4));if(m<60)return `${m} min`;const h=Math.floor(m/60),r=m%60;return r?`${h} h ${r} min`:`${h} h`};
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const sign=n=>n>0?'+':n<0?'−':'';
const tok=s=>s.w>0?`${kg(s.w)} × ${s.r}`:`${s.r} reps`;
const repRange=it=>it.min===it.max?`${it.min}`:`${it.min}–${it.max}`;
const I={
  bar:'<path d="M2.5 12h19M5.5 8.5v7M8.5 6.5v11M15.5 6.5v11M18.5 8.5v7"/>',
  cog:'<path d="M4 7.5h8.5M16.5 7.5H20M4 16.5h3.5M11.5 16.5H20"/><circle cx="14.5" cy="7.5" r="2"/><circle cx="9.5" cy="16.5" r="2"/>',
  left:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  right:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
  check:'<path d="M6.5 12.5l3.5 3.5 7.5-8"/>',
  more:'<circle cx="6" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
  arrowUp:'<path d="M12 18V6.5M7 11.5l5-5 5 5"/>',
  flat:'<path d="M7 12h10"/>',
  chevUp:'<path d="M6.5 14.5L12 9l5.5 5.5"/>',
  chevDown:'<path d="M6.5 9.5L12 15l5.5-5.5"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',
  minus:'<path d="M5.5 12h13"/>'
};
const icon=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ───────── Estado (se guarda en este iPhone) ───────── */
const fresh=()=>({v:1,ex:{},days:[],sessions:[],body:[],draft:null,goal:4,backup:null,sample:false,skips:[]});
let S=load();
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===1)return Object.assign(fresh(),d)}}catch(e){}
  return fresh();
}
let saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){if(!saveWarned){saveWarned=true;toast('No se han podido guardar los cambios en este iPhone.')}}
}
let saveT=0;
const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,250)};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

/* ───────── Lógica de entreno ───────── */
const exName=id=>S.ex[id]?S.ex[id].name:'Ejercicio borrado';
const findEx=name=>{const n=norm(name);return Object.values(S.ex).find(e=>norm(e.name)===n)};
const catMuscle=name=>{const n=norm(name);const c=CATALOG.find(x=>norm(x[0])===n);return c?c[1]:null};
const byTime=()=>S.sessions.slice().sort((a,b)=>a.start-b.start);
const sessionTitle=s=>s.dayLabel?`${s.dayName}, ${s.dayLabel}`:s.dayName;
function history(exId){
  const out=[];
  for(const s of byTime())for(const en of s.entries){
    if(en.ex!==exId||!en.sets.length)continue;
    let maxW=-1,maxWr=0,best=-1,bestSet=en.sets[0],vol=0,maxR=0,tot=0;
    for(const st of en.sets){
      if(st.w>maxW||(st.w===maxW&&st.r>maxWr)){maxW=st.w;maxWr=st.r}
      const v=e1(st.w,st.r);if(v>best){best=v;bestSet=st}
      vol+=st.w*st.r;tot+=st.r;if(st.r>maxR)maxR=st.r;
    }
    out.push({s,en,t:s.start,maxW,maxWr,best,bestSet,vol,maxR,tot});
  }
  return out;
}
const isBW=h=>h.length>0&&h.every(x=>x.maxW===0);
function findItem(id){for(const d of S.days)for(const it of d.items)if(it.id===id)return it;return null}
function lastEntry(exId,item){
  let any=null;
  const same=en=>{if(!item)return false;if(en.item===item.id)return true;const o=en.item?findItem(en.item):null;return !!o&&o.sets===item.sets&&o.min===item.min&&o.max===item.max};
  for(const s of S.sessions.slice().sort((a,b)=>b.start-a.start))for(const en of s.entries){
    if(en.ex!==exId||!en.sets.length)continue;
    if(same(en))return en;
    if(!any)any=en;
  }
  return any;
}
function suggestion(item,ex,last){
  if(!item||!last||!ex)return null;
  const top=last.sets.slice(0,item.sets);
  if(top.length<item.sets||top.some(s=>s.w<=0))return null;
  if(!top.every(s=>s.r>=item.max))return null;
  return r4(Math.max(...top.map(s=>s.w))+(ex.inc||2.5));
}
function score(x){let r=0;for(const st of x.en.sets)if(st.w===x.maxW)r+=st.r;return [x.maxW,r]}
const better=(a,b)=>a[0]>b[0]+1e-9||(Math.abs(a[0]-b[0])<1e-9&&a[1]>b[1]);
function stalled(exId){
  const h=history(exId);if(h.length<4)return false;
  let best=score(h[0]);for(const x of h.slice(1,-3)){const s=score(x);if(better(s,best))best=s}
  return !h.slice(-3).some(x=>better(score(x),best));
}
function baseline(exId){
  const h=history(exId);if(!h.length)return null;
  return {w:Math.max(...h.map(x=>x.maxW)),e:Math.max(...h.map(x=>x.best)),r:Math.max(...h.map(x=>x.maxR)),bw:isBW(h)};
}
function markRecords(en){
  for(const st of en.sets)st.rec=null;
  const b=baseline(en.ex);if(!b)return;
  const done=en.sets.filter(st=>st.done);if(!done.length)return;
  if(b.bw&&done.every(st=>+st.w===0)){const top=done.reduce((a,c)=>+c.r>+a.r?c:a);if(+top.r>b.r)top.rec='reps';return}
  const hw=done.reduce((a,c)=>+c.w>+a.w?c:a);
  const he=done.reduce((a,c)=>e1(+c.w,+c.r)>e1(+a.w,+a.r)?c:a);
  if(+hw.w>b.w+1e-9)hw.rec='peso';
  if(!he.rec&&e1(+he.w,+he.r)>b.e+0.05)he.rec='1rm';
}
function muscleOpts(cur){const set=new Set(MUSCLES.filter(m=>m!=='Otro'));const own=[...new Set(Object.values(S.ex).map(e=>e.muscle).concat(cur?[cur]:[]))].filter(m=>m&&!set.has(m)&&m!=='Otro').sort((a,b)=>a.localeCompare(b,'es'));return [...set,...own,'Otro']}
const recText=st=>st.rec==='peso'?'Récord de peso':st.rec==='reps'?'Récord de repeticiones':`Récord de 1RM estimado: ${kg(half(e1(+st.w,+st.r)))} kg`;
function makeEntry(exId,item){
  const ex=S.ex[exId];const last=lastEntry(exId,item||null);
  const target=item?item.sets:(last?last.sets.length:3);
  const sug=suggestion(item,ex,last);
  const inc=(ex&&ex.inc)||2.5;
  const sets=[];
  for(let i=0;i<target;i++){
    const p=last?(last.sets[i]||last.sets[last.sets.length-1]):null;
    let hw=p?p.w:'',hr=p?p.r:(item?item.min:'');
    if(sug!=null&&p){hw=r4(p.w+inc);hr=item.min}
    sets.push({w:'',r:'',hw,hr,done:false,rec:null});
  }
  return {ex:exId,item:item?item.id:null,min:item?item.min:null,max:item?item.max:null,target,sug,stall:stalled(exId),last:last?last.sets.map(s=>({w:s.w,r:s.r})):null,sets};
}
const isoT=t=>isoDate(new Date(t));
const skipOn=t=>(S.skips||[]).find(k=>k.date===isoT(t));
const sdur=s=>s.late?'—':dur(s.end-s.start);
function nextDay(){
  let last=null;
  for(const x of S.sessions)if(!last||x.start>last.start)last=x;
  for(const k of S.skips||[])if(k.advance&&(!last||k.t>last.start))last={start:k.t,day:k.day};
  if(!last)return S.days[0];
  const i=S.days.findIndex(d=>d.id===last.day);
  return S.days[(i+1)%S.days.length]||S.days[0];
}
function lastDone(dayId){let t=0;for(const s of S.sessions)if(s.day===dayId&&s.start>t)t=s.start;return t}
function trainedDays(from,to){const set=new Set();for(const s of S.sessions)if(s.start>=from&&s.start<to)set.add(dayStart(s.start));return set}
function streakWeeks(){
  const goal=Math.max(1,S.goal||1);
  const cnt=w=>trainedDays(w,addDays(w,7)).size;
  let w=weekStart(Date.now()),n=0;
  if(cnt(w)>=goal)n++;
  w=addDays(w,-7);
  while(n<520&&cnt(w)>=goal){n++;w=addDays(w,-7)}
  return n;
}
function muscleSets(from,to){
  const m=new Map();
  for(const s of S.sessions){if(s.start<from||s.start>=to)continue;for(const en of s.entries){const k=(S.ex[en.ex]&&S.ex[en.ex].muscle)||'Otro';m.set(k,(m.get(k)||0)+en.sets.length)}}
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function strengthChange(){
  const now=Date.now(),a=now-28*DAY,b=now-56*DAY,out=[];
  for(const id of Object.keys(S.ex)){
    const hh=history(id);if(!hh.length||isBW(hh))continue;
    const cur=hh.filter(x=>x.t>=a),prev=hh.filter(x=>x.t<a&&x.t>=b);
    const before=prev.length?prev:hh.filter(x=>x.t<a).slice(-1);
    if(!cur.length||!before.length)continue;
    const c=Math.max(...cur.map(x=>x.best)),p=Math.max(...before.map(x=>x.best));
    if(p>0)out.push({id,pct:(c-p)/p,diff:c-p});
  }
  return out;
}
function recordsSince(t){
  const recs=[],best={},bw={};
  for(const s of byTime())for(const en of s.entries){
    if(!en.sets.length)continue;
    const e=Math.max(...en.sets.map(x=>e1(x.w,x.r))),w=Math.max(...en.sets.map(x=>x.w));
    const k=en.ex,had=k in best;
    if(had&&s.start>=t&&(e>best[k]+0.05||w>bw[k]+1e-9))recs.push({ex:k,t:s.start,set:en.sets.reduce((a,c)=>e1(c.w,c.r)>e1(a.w,a.r)?c:a)});
    best[k]=had?Math.max(best[k],e):e;bw[k]=had?Math.max(bw[k],w):w;
  }
  return recs;
}
function nextActions(){
  const up=[],seen=new Set(),since=Date.now()-42*DAY;
  for(const d of S.days)for(const it of d.items){
    const ex=S.ex[it.ex];if(!ex||seen.has(ex.id))continue;
    const last=lastEntry(ex.id,it),w=suggestion(it,ex,last);
    if(w!=null){seen.add(ex.id);up.push({id:ex.id,day:d.name,w})}
  }
  const flat=[];
  for(const id of Object.keys(S.ex)){
    if(seen.has(id))continue;const h=history(id);
    if(h.length&&h[h.length-1].t>=since&&stalled(id))flat.push({id,day:''});
  }
  return {up,flat};
}

  /* 2. Volumen por semana */
  const weeks=[];for(let i=7;i>=0;i--){const a=addDays(ws,-7*i),b=addDays(a,7);let v=0,n=0;for(const s of S.sessions)if(s.start>=a&&s.start<b)for(const en of s.entries)for(const st of en.sets){v+=st.w*st.r;n++}weeks.push({a,v,n})}

    h+=`</ul>${na.flat.length?`<p class="help">Si un ejercicio se atasca, revisa técnica, descanso y sueño. Si se atascan varios a la vez, toca semana de descarga: mitad de series y más lejos del fallo.</p>`:''}</section>`;
  }
  /* 4. Series por músculo frente al plan */
  const plan=new Map();for(const d of S.days)for(const it of d.items){const m=(S.ex[it.ex]&&S.ex[it.ex].muscle)||'Otro';plan.set(m,(plan.get(m)||0)+it.sets)}
  const done=new Map(muscleSets(ws,addDays(ws,7)));

const PH={db:null,urls:new Map(),
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('mch-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p',mode),st=t.objectStore('p'),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  async all(){try{return ((await this.tx('readonly',st=>st.getAll()))||[]).sort((a,b)=>b.t-a.t)}catch(e){return []}},
  put(o){return this.tx('readwrite',st=>st.put(o))},
  del(id){return this.tx('readwrite',st=>st.delete(id))},
  url(p){if(!this.urls.has(p.id))this.urls.set(p.id,URL.createObjectURL(p.blob));return this.urls.get(p.id)}
};
async function fillPhotos(){

}
async function addPhoto(file){
  if(!file)return;
  try{
    const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.84));
    await PH.put({id:uid(),t:Date.now(),blob});toast('Foto guardada');fillPhotos();
  }catch(e){toast('No se ha podido guardar la foto.')}
}

async function fillCompare(c){
  const box=document.getElementById('cmp');if(!box)return;
  const ps=(await PH.all()).sort((a,b)=>a.t-b.t);if(ps.length<2){box.innerHTML='<p class="lead">Necesitas al menos dos fotos.</p>';return}
  const A=ps.find(p=>p.id===c.a)||ps[0],B=ps.find(p=>p.id===c.b)||ps[ps.length-1];
  const strip=(sel,key)=>`<div class="ph-strip">${ps.map(p=>`<button class="ph sm${p.id===sel.id?' sel':''}" data-act="cmp-pick" data-w="${key}" data-id="${esc(p.id)}" aria-pressed="${p.id===sel.id}"><img src="${PH.url(p)}" alt=""><span>${esc(F.short.format(p.t))}</span></button>`).join('')}</div>`;
  box.innerHTML=`<div class="cmp"><img src="${PH.url(A)}" alt="Antes"><img class="after" src="${PH.url(B)}" alt="Después" style="clip-path:inset(0 0 0 50%)"><i class="cmp-line" style="left:50%"></i><span class="cmp-l">${esc(F.short.format(A.t))}</span><span class="cmp-r">${esc(F.short.format(B.t))}</span></div>
  <input class="cmp-range" type="range" min="0" max="100" value="50" aria-label="Deslizar entre antes y después">
  <h2 class="h sec">Antes</h2>${strip(A,'a')}<h2 class="h sec">Después</h2>${strip(B,'b')}`;
  const rg=box.querySelector('.cmp-range'),af=box.querySelector('.after'),ln=box.querySelector('.cmp-line');
  rg.addEventListener('input',()=>{af.style.clipPath=`inset(0 0 0 ${rg.value}%)`;ln.style.left=rg.value+'%'});
  const area=box.querySelector('.cmp');
  const mv=e=>{const r=area.getBoundingClientRect();const v=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));rg.value=v;rg.dispatchEvent(new Event('input'))};
  area.addEventListener('pointerdown',e=>{area.setPointerCapture(e.pointerId);mv(e)});area.addEventListener('pointermove',e=>{if(e.buttons)mv(e)});
}

function pickRows(q){
  const n=norm(q);
  const lib=Object.values(S.ex).sort((a,b)=>a.name.localeCompare(b.name,'es')).map(e=>({id:e.id,name:e.name,muscle:e.muscle}));
  const have=new Set(lib.map(e=>norm(e.name)));
  const cat=CATALOG.filter(x=>!have.has(norm(x[0]))).map(x=>({id:'',name:x[0],muscle:x[1]})).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  let all=[...lib,...cat];
  if(n)all=all.filter(e=>norm(e.name).includes(n));
  const row=(e,t,s)=>`<li><button class="row" data-act="pick" data-id="${esc(e.id)}" data-name="${esc(e.name)}" data-muscle="${esc(e.muscle)}"><span class="main"><span class="t">${esc(t)}</span><span class="s">${esc(s)}</span></span>${icon('plus','i chev')}</button></li>`;
  let rows=all.slice(0,80).map(e=>row(e,e.name,e.muscle)).join('');
  if(q.trim()&&!all.some(e=>norm(e.name)===n))rows=row({id:'',name:q.trim(),muscle:catMuscle(q)||'Otro'},`Crear «${q.trim()}»`,'Ejercicio nuevo')+rows;
  return rows||`<li class="muted pad">No hay ejercicios con ese nombre.</li>`;
}

/* ───────── Gráficas (SVG a tamaño real) ───────── */
const charts=new Map();
function chartBox(id,pts,unit,label){
  charts.set(id,{pts,unit,sel:null});
  return `<div class="chart" id="${id}" tabindex="0" role="img" aria-label="${esc(label)}. Toca la gráfica para ver cada fecha."><svg aria-hidden="true"></svg><div class="tip" aria-hidden="true"></div></div>`;
}
function mountCharts(){
  for(const [id,c] of charts){
    const el=document.getElementById(id);if(!el)continue;
    c.el=el;const draw=()=>drawChart(c);
    c.ro=new ResizeObserver(draw);c.ro.observe(el);
    bindChart(c);
  }
}
function niceStep(range,count){
  const raw=range/Math.max(1,count),p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
const fmtVal=(v,unit)=>unit==='kg'?`${kg(v)} kg`:unit==='cm'?`${NF1.format(v)} cm`:unit==='x'?NF.format(v):`${v} reps`;
function drawChart(c){
  const el=c.el,svg=el.querySelector('svg'),W=el.clientWidth,H=el.clientHeight;
  if(!W||!H)return;
  const P=c.pts,R=W<360?36:44,T=12,B=26,L=2;
  let x0=P[0].x,x1=P[P.length-1].x;if(x1-x0<DAY){x0-=DAY*3;x1+=DAY*3}
  let lo=Math.min(...P.map(p=>p.y)),hi=Math.max(...P.map(p=>p.y));
  if(hi-lo<1e-9){lo-=1;hi+=1}
  const step=niceStep(hi-lo,3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi<=lo)hi=lo+step;
  const pw=W-L-R,ph=H-T-B;
  const X=x=>L+(x-x0)/(x1-x0)*pw,Y=y=>T+(1-(y-lo)/(hi-lo))*ph;
  c.X=X;c.Y=Y;
  const big=hi>=10000;
  let g='';
  for(let v=lo,k=0;v<=hi+step/2&&k<12;v+=step,k++){
    const y=Math.round(Y(v))+.5;
    g+=`<line class="grid" x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}"/><text class="tick" x="${W}" y="${y+4}" text-anchor="end">${esc(big?NFC.format(v):kg(Math.round(v*100)/100))}</text>`;
  }
  g+=`<text class="tick" x="${L}" y="${H-4}">${esc(F.short.format(P[0].x))}</text>`;
  if(P.length>1)g+=`<text class="tick" x="${L+pw}" y="${H-4}" text-anchor="end">${esc(F.short.format(P[P.length-1].x))}</text>`;
  const d=P.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const lp=P[P.length-1];
  svg.innerHTML=`${g}${P.length>1?`<path class="ln" d="${d}"/>`:''}<circle class="end" cx="${X(lp.x).toFixed(1)}" cy="${Y(lp.y).toFixed(1)}" r="4.5"/><g class="xh" style="display:none"><line class="xl" y1="${T}" y2="${T+ph}"/><circle class="xd" r="5"/></g>`;
  if(c.sel!=null)showPoint(c,c.sel);
}
function showPoint(c,i){
  if(!c.X)return;
  c.sel=i;const p=c.pts[i],svg=c.el.querySelector('svg'),g=svg.querySelector('.xh');if(!g)return;
  const x=c.X(p.x),y=c.Y(p.y),xl=g.querySelector('.xl'),dot=g.querySelector('.xd');
  g.style.display='';const xr=Math.round(x)+.5;xl.setAttribute('x1',xr);xl.setAttribute('x2',xr);dot.setAttribute('cx',x);dot.setAttribute('cy',y);
  const tip=c.el.querySelector('.tip');
  tip.innerHTML=`<b>${esc(fmtVal(p.y,c.unit))}</b><span>${esc(cap(F.wd.format(p.x)))}</span>${p.d?`<span>${esc(p.d)}</span>`:''}`;
  const W=c.el.clientWidth,tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=Math.max(tw/2,Math.min(W-tw/2,x))+'px';
  let top=y-th-14;if(top<-th/2)top=y+14;
  tip.style.top=top+'px';tip.classList.add('on');
}
function hidePoint(c){c.sel=null;const g=c.el.querySelector('.xh');if(g)g.style.display='none';c.el.querySelector('.tip').classList.remove('on')}
function bindChart(c){
  const el=c.el;
  const pick=e=>{if(!c.X)return;const r=el.getBoundingClientRect(),x=e.clientX-r.left;let best=0,bd=Infinity;c.pts.forEach((p,i)=>{const dd=Math.abs(c.X(p.x)-x);if(dd<bd){bd=dd;best=i}});showPoint(c,best)};
  el.addEventListener('pointerdown',pick);
  el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pick(e)});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hidePoint(c)});
  el.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    e.preventDefault();const n=c.pts.length;const i=c.sel==null?n-1:Math.max(0,Math.min(n-1,c.sel+(e.key==='ArrowLeft'?-1:1)));showPoint(c,i);
  });
  el.addEventListener('focus',()=>{if(c.sel==null)showPoint(c,c.pts.length-1)});
  el.addEventListener('blur',()=>hidePoint(c));
}
function spark(vals){
  if(vals.length<2)return '<span class="spark" aria-hidden="true"></span>';
  const w=64,h=24,p=3,lo=Math.min(...vals),hi=Math.max(...vals);
  const X=i=>p+i*(w-2*p)/(vals.length-1),Y=v=>hi===lo?h/2:p+(1-(v-lo)/(hi-lo))*(h-2*p);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('')}"/><circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="2.75"/></svg>`;
}

const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),toastEl=document.getElementById('toast');
let sheetOpen=false,lastFocus=null,sheetActs=[],closeT=0;
function openSheet(html){
  clearTimeout(closeT);
  sheet.innerHTML=`<div class="grab" aria-hidden="true"></div>${html}`;
  sheet.hidden=false;scrim.hidden=false;sheet.style.transform='';sheet.classList.remove('closing');

function startDay(id,t){
  const day=S.days.find(d=>d.id===id);if(!day)return;
  const now=Date.now(),past=t!=null&&dayStart(+t)<dayStart(now),start=past?dayStart(+t)+19*3600e3:now;
  S.skips=(S.skips||[]).filter(k=>k.date!==isoT(start));
  S.draft={id:uid(),day:day.id,dayName:day.name,dayLabel:day.label||'',start,created:now,past,lastAt:null,y:0,entries:day.items.filter(it=>S.ex[it.ex]).map(it=>makeEntry(it.ex,it))};
  save();closeSheet();nav=[{v:'hoy'},{v:'workout'}];render();scrollTo(0,0);
}

function refreshEntry(i){const el=document.getElementById('ex-'+i);if(el&&S.draft&&S.draft.entries[i])el.outerHTML=exBlock(S.draft.entries[i],i)}
function patchRecs(i){
  const en=S.draft&&S.draft.entries[i],box=document.getElementById('ex-'+i);if(!en||!box)return;
  en.sets.forEach((st,j)=>{
    const row=box.querySelector(`.set[data-j="${j}"]`);if(!row)return;
    row.classList.toggle('rec',!!st.rec);row.classList.toggle('done',!!st.done);
    let line=row.querySelector('.rec-line');
    if(st.rec){if(!line){line=document.createElement('p');line.className='rec-line';row.appendChild(line)}line.innerHTML=`<i></i>${esc(recText(st))}`}
    else if(line)line.remove();
  });
}

function moveEntry(i,d){const a=S.draft.entries,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderKeep()}
function finish(force){
  const d=S.draft;if(!d)return;
  let pending=0,doneN=0;for(const en of d.entries)for(const s of en.sets)s.done?doneN++:pending++;
  if(!doneN)return actionSheet('No hay series marcadas','Marca con el círculo las series que hayas hecho. Si hoy no vas a entrenar, descarta el entreno.',[{label:'Seguir entrenando',kind:'primary'},{label:'Descartar entreno',kind:'soft danger',run:discardNow}]);
  if(pending&&!force)return actionSheet(`${pending===1?'Queda 1 serie':`Quedan ${pending} series`} sin marcar`,'Solo se guardan las series marcadas.',[{label:'Terminar igualmente',kind:'primary',run:()=>finish(true)},{label:'Seguir entrenando',kind:'soft'}]);
  const entries=[],recs=[];
  for(const en of d.entries){
    const sets=en.sets.filter(s=>s.done).map(s=>({w:+s.w,r:+s.r}));
    if(sets.length)entries.push({ex:en.ex,item:en.item,sets});
    for(const s of en.sets)if(s.done&&s.rec)recs.push({ex:en.ex,w:+s.w,r:+s.r,rec:s.rec});
  }
  const end=d.past?d.start:Math.max(d.start+6e4,d.lastAt||Date.now());
  const s={id:d.id,day:d.day,dayName:d.dayName,dayLabel:d.dayLabel,start:d.start,end,entries};if(d.past)s.late=true;
  S.sessions.push(s);S.draft=null;save();
  nav=[{v:'hoy'}];render();scrollTo(0,0);
  const nSets=entries.reduce((n,en)=>n+en.sets.length,0),vol=entries.reduce((n,en)=>n+en.sets.reduce((m,st)=>m+st.w*st.r,0),0);
  sheetActs=[];
  openSheet(`<h2 class="sh-t">Entreno guardado</h2><p class="sh-p">${esc(sessionTitle(s))}</p>
  <div class="stats">${stat(String(entries.length),entries.length===1?'Ejercicio':'Ejercicios')}${stat(String(nSets),'Series')}${stat(kg(Math.round(vol))+' kg','Volumen')}</div>
  ${recs.length?`<h3 class="sh-h">${recs.length===1?'Un récord':`${recs.length} récords`}</h3><ul class="plain">${recs.map(r=>`<li><i class="dot"></i><span class="grow">${esc(exName(r.ex))}</span><span class="num">${esc(tok(r))}</span></li>`).join('')}</ul>`:''}
  <div class="sh-acts"><button class="btn primary" data-act="sheet-close">Hecho</button></div>`);
}
async function exportBackup(){
  const data=JSON.stringify({app:'mch',v:1,exported:new Date().toISOString(),data:S});
  const name=`mch-copia-${isoDate(new Date())}.json`;
  const done=()=>{S.backup=Date.now();save();toast('Copia exportada');renderKeep()};
  let file=null;try{file=new File([data],name,{type:'application/json'})}catch(e){}
  try{
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de MCH'});done();return}
  }catch(err){if(err&&err.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(file||new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);done();
  }catch(e){toast('No se ha podido exportar la copia.')}
}
function importFile(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let obj=null;try{obj=JSON.parse(rd.result)}catch(e){}
    const d=obj&&(obj.app==='mch'||obj.app==='hierro')&&obj.data;
    if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.days)||!d.ex||typeof d.ex!=='object'){toast('Ese archivo no es una copia de MCH.');return}
    const when=obj.exported?F.short.format(new Date(obj.exported)):'';
    actionSheet('¿Recuperar esta copia?',`${when?`Es del ${when} y tiene `:'Tiene '}${plural(d.sessions.length,'entreno','entrenos')}. Sustituirá todo lo que hay ahora en la app.`,[
      {label:'Recuperar copia',kind:'primary',run:()=>{S=Object.assign(fresh(),d,{v:1});save();nav=[{v:'hoy'}];render();scrollTo(0,0);toast('Copia recuperada')}},
      {label:'Cancelar',kind:'soft'}]);
  };
  rd.onerror=()=>toast('No se ha podido leer el archivo.');
  rd.readAsText(file);
}

  'del-item':d=>{const day=S.days.find(x=>x.id===d.day);if(!day)return;day.items=day.items.filter(x=>x.id!==d.id);save();back();toast('Ejercicio quitado')}
};
function readSessionEdits(c,validate){
  let ok=true;
  for(const row of document.querySelectorAll('.eset')){
    const en=c.tmp.entries[+row.dataset.i],st=en&&en.sets[+row.dataset.j];if(!st)continue;
    const w=toNum(row.querySelector('.w').value),r=toNum(row.querySelector('.r').value);
    if(Number.isFinite(w)&&w>=0)st.w=w;else if(validate){ok=false;row.querySelector('.w').focus();toast('Revisa el peso de esa serie.');break}
    if(Number.isFinite(r)&&r>=1)st.r=Math.round(r);else if(validate){ok=false;row.querySelector('.r').focus();toast('Revisa las repeticiones de esa serie.');break}
  }
  return ok;
}

const FORMS={
  day:()=>{
    const c=cur(),name=$('#f-dname').value.trim(),label=$('#f-dlabel').value.trim();
    if(!name){$('#f-dname').focus();return toast('Ponle un nombre al día.')}
    if(c.id){const d=S.days.find(x=>x.id===c.id);if(d){d.name=name;d.label=label}save();back();toast('Día guardado');return}
    const d={id:uid(),name,label,items:[]};S.days.push(d);save();
    nav.pop();cur().y=scrollY;nav.push({v:'item',day:d.id,id:null});render();scrollTo(0,0);toast(`${name} creado. Añade su primer ejercicio.`);
  },
  item:()=>{
    const c=cur(),day=S.days.find(x=>x.id===c.day);if(!day)return back();
    const name=$('#f-name').value.trim().replace(/\s+/g,' ');
    if(!name){$('#f-name').focus();return toast('Escribe el nombre del ejercicio.')}
    const sets=Math.round(toNum($('#f-sets').value)),min=Math.round(toNum($('#f-min').value)),max=Math.round(toNum($('#f-max').value));
    if(!(sets>=1&&sets<=20)){$('#f-sets').focus();return toast('Pon entre 1 y 20 series.')}
    if(!(min>=1&&min<=100)){$('#f-min').focus();return toast('Escribe desde cuántas repeticiones.')}
    if(!(max>=1&&max<=100)){$('#f-max').focus();return toast('Escribe hasta cuántas repeticiones.')}
    if(min>max){$('#f-max').focus();return toast('El máximo de repeticiones tiene que ser igual o mayor que el mínimo.')}
    let ex=findEx(name);
    if(!ex){ex={id:uid(),name:cap(name),muscle:'Otro',note:'',inc:2.5};S.ex[ex.id]=ex}
    ex.muscle=$('#f-muscle').value;ex.inc=toNum($('#f-inc').value)||2.5;ex.note=$('#f-note').value.trim();
    if(c.id){const it=day.items.find(x=>x.id===c.id);if(it)Object.assign(it,{ex:ex.id,sets,min,max})}

  },
  exedit:()=>{
    const c=cur(),e=S.ex[c.id];if(!e)return back();
    const name=$('#e-name').value.trim().replace(/\s+/g,' ');
    if(!name){$('#e-name').focus();return toast('Escribe el nombre del ejercicio.')}
    const other=findEx(name);if(other&&other.id!==e.id){$('#e-name').focus();return toast('Ya tienes un ejercicio con ese nombre.')}
    e.name=name;e.muscle=$('#e-muscle').value;e.inc=toNum($('#e-inc').value)||2.5;e.note=$('#e-note').value.trim();
    save();back();toast('Ejercicio guardado');
  },
  measure:()=>{
    const c=cur(),v=toNum($('#m-val').value);
    if(!(v>0&&v<400)){$('#m-val').focus();return toast('Escribe la medida en centímetros.')}
    const d=isoDate(new Date());let e=S.body.find(x=>x.date===d);
    if(!e){e={id:uid(),date:d,weight:null};S.body.push(e)}
    e[c.k]=Math.round(v*10)/10;save();renderKeep();toast('Medida guardada');
  },
  body:()=>{
    const c=cur(),date=$('#b-date').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){$('#b-date').focus();return toast('Elige la fecha.')}
    const rd=id=>{const v=$(id).value.trim();if(!v)return null;const n=toNum(v);return Number.isFinite(n)&&n>0?n:NaN};
    const e={id:c.id||uid(),date,weight:rd('#b-weight')};
    for(const [k] of MEASURES)e[k]=rd('#b-'+k);
    const vals=['weight',...MEASURES.map(m=>m[0])].map(k=>e[k]);
    if(vals.some(v=>Number.isNaN(v)))return toast('Revisa los números: usa solo cifras y coma.');
    if(vals.every(v=>v==null)){$('#b-weight').focus();return toast('Apunta al menos el peso o una medida.')}

  }

/* ───────── Datos de ejemplo ───────── */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function loadSample(){
  const rnd=mulberry(11),s=fresh();s.sample=true;s.goal=4;
  const plan=[
    ['Día 1','Pecho y tríceps',[['Press banca','Pecho',4,6,8,2.5,'Agarre un dedo más abierto que los hombros.',70],['Press inclinado con mancuernas','Pecho',3,8,10,2,'',24],['Cruce de poleas','Pecho',3,12,15,2.5,'',15],['Fondos','Tríceps',3,8,12,2.5,'',0],['Extensión de tríceps en polea','Tríceps',3,10,12,2.5,'',25]]],
    ['Día 2','Espalda y bíceps',[['Dominadas','Espalda',4,6,10,2.5,'',0],['Remo con barra','Espalda',4,8,10,2.5,'',60],['Jalón al pecho','Espalda',3,10,12,2.5,'Asiento en el 4.',55],['Curl con barra','Bíceps',3,8,12,2.5,'',30],['Curl martillo','Bíceps',3,10,12,2,'',14]]],
    ['Día 3','Pierna',[['Sentadilla','Cuádriceps',4,6,8,2.5,'Pies a la anchura de los hombros.',90],['Peso muerto rumano','Femoral',3,8,10,2.5,'',80],['Prensa','Cuádriceps',3,10,12,5,'',160],['Curl femoral','Femoral',3,10,12,2.5,'',40],['Gemelos de pie','Gemelo',4,12,15,5,'',80]]],
    ['Día 4','Hombro',[['Press militar','Hombro',4,6,8,2.5,'',45],['Elevaciones laterales','Hombro',4,12,15,1,'',8],['Face pull','Hombro',3,12,15,2.5,'',20],['Press francés','Tríceps',3,8,12,2.5,'',25]]]
  ];
  const st={};
  for(const [name,label,items] of plan){
    const day={id:uid(),name,label,items:[]};
    for(const [en,mus,sets,min,max,inc,note,w0] of items){
      const ex={id:uid(),name:en,muscle:mus,note,inc};s.ex[ex.id]=ex;
      const it={id:uid(),ex:ex.id,sets,min,max};day.items.push(it);
      st[it.id]={w:w0,r:min+Math.floor(rnd()*2)};
    }
    s.days.push(day);
  }
  const now=Date.now(),today=dayStart(now),w0=addDays(weekStart(now),-63),slots=[0,1,3,5];
  let k=0;
  for(let wk=0;wk<=9;wk++)for(const sl of slots){
    const t=addDays(w0,wk*7+sl);if(t>=today)continue;if(rnd()<0.07)continue;
    const day=s.days[k%s.days.length];k++;
    const d=new Date(t);d.setHours(18,5+Math.floor(rnd()*45),0,0);const start=d.getTime();
    const entries=[];
    for(const it of day.items){
      const p=st[it.id],ex=s.ex[it.ex],cap2=p.w>0?it.max:it.max+4,sets=[];
      for(let j=0;j<it.sets;j++){let r=p.r-(j>=2&&rnd()<0.45?1:0)-(j===it.sets-1&&rnd()<0.2?1:0);r=Math.max(it.min-1,Math.min(cap2,r));sets.push({w:p.w,r})}
      entries.push({ex:it.ex,item:it.id,sets});
      const stuck=ex.name==='Press militar'&&wk>=5;
      if(!stuck){
        if(p.w>0&&sets.every(x=>x.r>=it.max)){p.w=r4(p.w+ex.inc);p.r=it.min}
        else if(rnd()<0.72)p.r=Math.min(cap2,p.r+1);
      }
    }
    s.sessions.push({id:uid(),day:day.id,dayName:day.name,dayLabel:day.label,start,end:start+(46+Math.floor(rnd()*26))*6e4,entries});
  }
  const bench=s.days[0].items[0],lastBench=s.sessions.slice().reverse().find(x=>x.entries.some(en=>en.item===bench.id));
  if(lastBench)for(const en of lastBench.entries)if(en.item===bench.id)en.sets=en.sets.map(x=>({w:x.w,r:bench.max}));
  let bw=81.6;
  for(let wk=0;wk<=9;wk++){
    const t=addDays(w0,wk*7+6);if(t>today)continue;
    bw=bw-0.3+(rnd()-0.5)*0.5;
    const e={id:uid(),date:isoDate(new Date(t)),weight:Math.round(bw*10)/10};
    if(wk%2===0)e.waist=Math.round((86.5-wk*0.4)*2)/2;
    if(wk%4===0){e.arm=Math.round((37+wk*0.1)*2)/2;e.chest=Math.round((103+wk*0.15)*2)/2}
    if(wk%2===0){e.shoulders=Math.round((118+wk*0.25)*2)/2;e.neck=Math.round((37.5+wk*0.06)*2)/2;e.hip=97;e.thigh=Math.round((56+wk*0.1)*2)/2}
    s.body.push(e);
  }
  S=s;save();
}
